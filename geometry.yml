# All lengths are in mm.
# The configuration structure below mirrors proto/ssl_vision_geometry.proto,
# see there for a description of all parameters.

# Vision multicast IP address
#vision_ip: "224.5.23.2"
# Vision multicast port
#vision_port: 10006

# SSL field markings that may be absent on lab/exhibition carpets.
# Toggle off any line your physical field does not have; emitting markings
# the camera cannot see disturbs refinement calibration.
optional_field_lines:
  goal2goal: false     # CenterLine running end-to-end through the field center
  halfway: false       # HalfwayLine splitting the field across its width
  centercircle: false  # CenterCircle arc at the field center
  penalty: false       # Penalty-area stretches in front of each goal

field:
  field_length: 3500        # フィールドの長さ（ゴールライン間）
  field_width: 2100         # フィールドの幅
  goal_width: 350          # ゴールの幅
  goal_depth: 100           # ゴールの奥行き
  goal_height: 160          # ゴールの高さ
  penalty_area_depth: 500  # ペナルティエリアの奥行き
  penalty_area_width: 1000  # ペナルティエリアの幅
  goal_center_to_penalty_mark: 4000
  boundary_width: 300
  boundary_width_goal_line: 300
  center_circle_radius: 500
  line_thickness: 10
  ball_radius: 21.5
  max_robot_radius: 90.0
  goal_substitution_area_width: 0

  # Default field lines and arcs are automatically generated by geom_publisher.py
  #field_lines:
  #- name: "Name"
  #  p1:
  #    x: 0.0
  #    y: 0.0
  #  p2:
  #    x: 0.0
  #    y: 0.0
  #  thickness: 0.0
  #  type: Undefined
  #field_arcs:
  #- name: "Name"
  #  center:
  #    x: 0.0
  #    y: 0.0
  #  radius: 0.0
  #  a1: 0.0
  #  a2: 0.0
  #  thickness: 0.0
  #  type: Undefined

# acc_slide and acc_roll are in m/s²
# Default values are from RoboCup 2026
models:
  straight_two_phase:
    acc_slide: -3.40
    acc_roll: -0.45
    k_switch: 0.64
  chip_fixed_loss:
    damping_xy_first_hop: 0.55
    damping_xy_other_hops: 0.88
    damping_z: 0.54

# Dynamically computed by VisionProcessor
# 部室フィールドの cam0 のキャリブレーション結果（2026-10-15、外枠4辺の線がそろった状態で計測）。
# ここに書いてあると vision_processor は起動時にキャリブレーションせず、この値を使う。
# カメラの位置や向きを動かしたら calib: を丸ごとコメントアウトして、キャリブレーションし直すこと。
calib:
  - camera_id: 0
    focal_length: 1145.86597
    principal_point_x: 948.03
    principal_point_y: 583.06488
    distortion: 0.636232376
    q0: 0.996432066
    q1: 0.0423626676
    q2: 0.0350204296
    q3: -0.0640487596
    tx: 24.9127808
    ty: -324.288757
    tz: 2586.8186
    derived_camera_world_tx: -193.413574
    derived_camera_world_ty: -0.17193833
    derived_camera_world_tz: 2600
    pixel_image_width: 1920
    pixel_image_height: 1080
